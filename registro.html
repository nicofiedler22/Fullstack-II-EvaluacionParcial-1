<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<header></header>
<body>
        <form name="contacto" id="contacto">
        <fieldset>
        <legend>Registro</legend>
<br><br>
        <label>Crear nombre de usuario: </label>
        <input type="text"
        required
        id="crearusuario"
        placeholder="Cree un nombre de usuario...">
<br><br>
        <label>Crear un correo electrónico: </label>
        <input type="text"
        required
        id="crearcorreo"
        placeholder="Cree un correo...">
<br><br>
        <label>Crear contraseña: </label>
        <input type="text"
        required
        id="crearcontraseña"
        placeholder="Cree una contraseña...">
<br><br>
        <label>Reingrese contraseña: </label>
        <input type="text"
        required
        id="reingreso_contraseña"
        placeholder="Reingrese una contraseña...">
<br><br>
        <button>INGRESAR</button>
    <script src="js/script.js"></script>
    
</body>
</html>
