<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <form name="contacto" id="contacto" novalidate>
        <fieldset>
            <legend>Registro</legend>
            <br><br>

            <div id="error-registro" style="color: red; font-weight: bold; margin-bottom: 15px;"></div>
            <div id="exito-registro" style="color: green; font-weight: bold; margin-bottom: 15px;"></div>

            <label for="nombre">Nombre: </label>
            <input type="text"
                   id="nombre"
                   placeholder="Ingrese su nombre...">
            <br><br>

            <label for="apellido">Apellido: </label>
            <input type="text"
                   id="apellido"
                   placeholder="Ingrese su apellido...">
            <br><br>

            <label for="crearusuario">Crear nombre de usuario: </label>
            <input type="text"
                   id="crearusuario"
                   placeholder="Cree un nombre de usuario...">
            <br><br>

            <label for="fecha_nacimiento">Fecha de nacimiento: </label>
            <input type="date"
                   id="fecha_nacimiento">
            <br><br>

            <label for="direccion">Dirección: </label>
            <input type="text"
                   id="direccion"
                   placeholder="Calle, número, depto...">
            <br><br>

            <label for="crearcorreo">Crear un correo electrónico: </label>
            <input type="text"
                   id="crearcorreo"
                   placeholder="Cree un correo...">
            <br><br>

            <label for="crearcontraseña">Crear contraseña: </label>
            <input type="password"
                   id="crearcontraseña"
                   placeholder="Cree una contraseña...">
            <br><br>

            <label for="reingreso_contraseña">Reingrese contraseña: </label>
            <input type="password"
                   id="reingreso_contraseña"
                   placeholder="Reingrese una contraseña...">
            <br><br>

            <button type="button" onclick="validarRegistro()">INGRESAR</button>
            <br><br>

            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            <p><a href="index.html">Volver a la página principal</a></p>
        </fieldset>
    </form>

    <script src="js/script.js"></script>
</body>
</html>
